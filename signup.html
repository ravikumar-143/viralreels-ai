<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — ViralReels AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <header class="auth-header">
    <a href="index.html" class="brand-logo">
      <span class="brand-icon">VR</span>
      <span>ViralReels AI</span>
    </a>
    <a href="index.html" class="back-link">&larr; Back to Home</a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Start turning ideas into viral-style faceless videos with AI.</p>

      <div id="setupBanner" class="setup-banner">
        <strong>Supabase not configured yet:</strong> Add your Project URL and Anon Key in <code>js/config.js</code>, or preview the UI using Demo Mode below.
      </div>

      <div id="alertBox" class="alert-box" role="alert"></div>

      <button type="button" id="googleAuthBtn" class="btn-oauth">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.5 3.9-5.5 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.4 14.6 2.5 12 2.5 6.8 2.5 2.5 6.8 2.5 12s4.3 9.5 9.5 9.5c5.5 0 9.1-3.9 9.1-9.3 0-.6-.1-1.1-.2-1.6H12z"/>
        </svg>
        Sign up with Google
      </button>

      <div class="divider">or sign up with email</div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Alex Rivera" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password (min. 6 characters)</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Create a strong password" required minlength="6" autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="password">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="termsCheckbox" required />
          <span>I agree to the ViralReels AI Terms of Service and Privacy Policy.</span>
        </label>

        <button type="submit" id="submitBtn" class="btn-primary">Create Account</button>
      </form>

      <button type="button" id="demoModeBtn" class="btn-demo" style="display: none;">
        Preview Dashboard in Demo Mode
      </button>

      <p class="auth-footer">
        Already have an account? <a href="login.html" class="text-link">Sign in</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
